name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly real-data smoke test
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: f1tel
          POSTGRES_PASSWORD: f1tel
          POSTGRES_DB: f1tel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U f1tel" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      F1TEL_TEST_DATABASE_URL: postgresql+psycopg://f1tel:f1tel@localhost:5432/f1tel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply on a clean PostgreSQL
        env:
          F1TEL_DATABASE_URL: postgresql+psycopg://f1tel:f1tel@localhost:5432/f1tel
        run: |
          PGPASSWORD=f1tel psql -h localhost -U f1tel -d postgres -c "CREATE DATABASE f1tel"
          alembic upgrade head
      - name: Tests (80% coverage gate, includes the PostgreSQL partition test)
        run: pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  nightly-smoke:
    # Loads one real session end to end. Needs repository secrets F1_USERNAME / F1_PASSWORD.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      F1_USERNAME: ${{ secrets.F1_USERNAME }}
      F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ingest Monza 2024 Q and verify checksums
        run: |
          f1tel ingest --year 2024 --event Monza --session Q --data-dir smoke-data
          f1tel verify --data-dir smoke-data

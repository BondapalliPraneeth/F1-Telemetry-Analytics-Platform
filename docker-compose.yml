# docker compose up --build            -> database, API (migrations run on start), dashboard
# docker compose --profile seed run --rm seed   -> ingest + load the 5 demo sessions
#
# The seed step needs a Formula 1 account (see README "Data access"). Export
# F1_USERNAME and F1_PASSWORD in your shell first; they are passed through, never stored.

x-api-env: &api-env
  F1TEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-f1tel}:${POSTGRES_PASSWORD:-f1tel}@db:5432/${POSTGRES_DB:-f1tel}
  F1TEL_DATA_DIR: /app/data
  F1TEL_FASTF1_CACHE_DIR: /app/.fastf1-cache
  F1TEL_CORS_ORIGINS: http://localhost:8080,http://localhost:5173

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1tel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1tel}
      POSTGRES_DB: ${POSTGRES_DB:-f1tel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1tel} -d ${POSTGRES_DB:-f1tel}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - f1data:/app/data

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *api-env
      F1_USERNAME: ${F1_USERNAME:-}
      F1_PASSWORD: ${F1_PASSWORD:-}
    depends_on:
      api:
        condition: service_started
    volumes:
      - f1data:/app/data
      - f1cache:/app/.fastf1-cache
    command: ["f1tel", "seed"]

volumes:
  pgdata:
  f1data:
  f1cache:
